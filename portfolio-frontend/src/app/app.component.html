<main class="container" *ngIf="!loading; else loadingTpl">
  <section *ngIf="profile as p">
    <h1>{{ p.name }}</h1>
    <h2>{{ p.role }}</h2>
    <p>{{ p.about }}</p>

    <h3>Skills</h3>
    <ul>
      <li *ngFor="let skill of p.skills">{{ skill }}</li>
    </ul>

    <h3>Proyectos</h3>
    <article *ngFor="let project of p.projects" class="project-card">
      <h4>{{ project.title }}</h4>
      <p>{{ project.description }}</p>
      <small>{{ project.tech }}</small><br>
      <a [href]="project.repository" target="_blank">Repositorio</a>
    </article>

    <h3>Contacto</h3>
    <p>Email: <a [href]="'mailto:' + p.email">{{ p.email }}</a></p>
    <p>LinkedIn: <a [href]="p.linkedin" target="_blank">Perfil</a></p>
  </section>
</main>

<ng-template #loadingTpl>
  <p>Cargando portfolio...</p>
</ng-template>
